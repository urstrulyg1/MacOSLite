name: G1OS build and readiness gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and ISO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config bc bison flex libssl-dev libelf-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libfreetype6-dev libudev-dev libx11-dev libasound2-dev \
            xorriso grub-efi-amd64-bin squashfs-tools cpio xz-utils \
            bzip2 file genisoimage shellcheck qemu-system-x86 \
            dosfstools mtools ovmf

      - name: Shell syntax and ShellCheck
        working-directory: macliteos
        run: |
          set -eu
          for f in $(find . -type f \( -name '*.sh' -o -path './installer/maclite-install' -o -path './installer/maclite-installer-backend' -o -path './boot/g1os-init' \)); do
            sh -n "$f"
            shellcheck -s sh "$f"
          done

      - name: Clean userspace build and tests
        working-directory: macliteos
        run: |
          set -eu
          make clean
          ./configure
          make -j"$(nproc)" all
          sh scripts/audit-production.sh
          sh scripts/run-tests.sh

      - name: Build G1OS kernel
        working-directory: macliteos
        run: sh scripts/build-kernel.sh

      - name: Build initramfs
        working-directory: macliteos
        run: |
          set -eu
          sh scripts/build-busybox.sh
          G1OS_BUSYBOX="$PWD/out/busybox" \
          G1OS_KERNEL_MODULES="$PWD/out/kernel-modules" \
            sh scripts/make-initrd.sh "$PWD/out/initrd-maclite.img"
          sh scripts/validate-boot-artifacts.sh "$PWD/out/initrd-maclite.img"

      - name: Assemble and independently verify ISO
        working-directory: macliteos
        run: |
          set -eu
          G1OS_KERNEL="$PWD/out/vmlinuz-maclite" \
          G1OS_INITRD="$PWD/out/initrd-maclite.img" \
            sh scripts/make-iso.sh --verify
          sh scripts/validate-boot-artifacts.sh "$PWD/out/initrd-maclite.img" "$PWD/out/G1OS.iso"
          sh scripts/audit-production.sh "$PWD/out/G1OS.iso"
          test -s out/G1OS.iso
          test -s out/G1OS.iso.sha256
          test -s out/iso-manifest.txt

      - name: Boot ISO under real UEFI QEMU and require graphical installer readiness
        working-directory: macliteos
        run: |
          set -eu
          timeout 60s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 2048 \
            -smp 2 \
            -vga std \
            -bios /usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive format=raw,file=out/G1OS.iso,if=ide,media=cdrom \
            -boot d \
            -serial stdio \
            -display none \
            -no-reboot \
            2>&1 | tee out/qemu-uefi-console.log || rc=$?
          rc=${rc:-0}
          if grep -F "Graphical installer ready: compositor responsive and installer surface present" out/qemu-uefi-console.log >/dev/null; then
            echo "PASS: QEMU UEFI reached the real graphical installer health gate."
          elif grep -qi "panic\|kernel BUG\|\[FAIL\]" out/qemu-uefi-console.log; then
            echo "ERROR: QEMU UEFI boot reported a kernel/init/graphics failure." >&2
            exit 1
          else
            echo "ERROR: QEMU UEFI boot did not prove graphical installer readiness." >&2
            tail -200 out/qemu-uefi-console.log >&2 || true
            exit 1
          fi
          [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || exit "$rc"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: G1OS-build
          path: |
            macliteos/out/G1OS.iso
            macliteos/out/G1OS.iso.sha256
            macliteos/out/iso-manifest.txt
            macliteos/out/iso-file-list.txt
            macliteos/out/vmlinuz-maclite
            macliteos/out/initrd-maclite.img
            macliteos/out/kernel-version.txt
            macliteos/out/kernel-source.sha256
            macliteos/out/qemu-uefi-console.log
