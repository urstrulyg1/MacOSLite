name: G1OS Visual Asset Quality

on:
  push:
    paths:
      - "src/os/icons/**"
      - "assets/source/**"
      - "scripts/validate-visual-assets.mjs"
      - "package.json"
  pull_request:
    paths:
      - "src/os/icons/**"
      - "assets/source/**"
      - "scripts/validate-visual-assets.mjs"
      - "package.json"

jobs:
  visual-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:visual-assets
      - run: npm run build
