# MacLiteOS EFI boot entry (Apple EFI 1.1 on iMac11,x accepts x86_64-efi GRUB)
set default=0
set timeout=3
insmod part_gpt
insmod fat
insmod loadefi

menuentry "MacLiteOS" {
    search --no-floppy --set=root --label MACLITE_BOOT
    linux /boot/vmlinuz-maclite root=LABEL=MACLITE_BASE ro quiet \
          rd.maclite=1 mitigations=off vt.global_cursordefault=0 \
          acpi_backlight=native radeon.modeset=1 radeon.uvd=1 \
          b43.fwok=1 reboot=pci
    initrd /boot/initrd-maclite.img
}
menuentry "MacLiteOS (safe graphics: software compositing)" {
    search --no-floppy --set=root --label MACLITE_BOOT
    linux /boot/vmlinuz-maclite root=LABEL=MACLITE_BASE ro quiet \
          rd.maclite=1 maclite.gl=off acpi_backlight=native reboot=pci
    initrd /boot/initrd-maclite.img
}
menuentry "MacLiteOS Recovery" {
    search --no-floppy --set=root --label MACLITE_BOOT
    linux /boot/vmlinuz-maclite root=LABEL=MACLITE_BASE ro quiet \
          rd.maclite=recovery acpi_backlight=native reboot=pci
    initrd /boot/initrd-maclite.img
}
