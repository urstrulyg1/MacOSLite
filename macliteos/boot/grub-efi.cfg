# MacLiteOS EFI boot entry (Apple EFI 1.1 on iMac11,x accepts x86_64-efi GRUB)
set default=0
set timeout=5
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod linux
insmod search

menuentry "G1OS (Safe Graphics - Default for iMac Mid-2010)" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite rd.maclite=1 maclite.gl=off nomodeset radeon.modeset=0 \
          video=efifb:novesa fbcon=map:0 console=tty0 efi=noruntime acpi_backlight=native reboot=pci panic=0
    initrd /boot/initrd-maclite.img
}

menuentry "G1OS (Safe Graphics + Verbose Debug)" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite rd.maclite=1 maclite.gl=off nomodeset radeon.modeset=0 \
          video=efifb:novesa fbcon=map:0 console=tty0 efi=noruntime debug ignore_loglevel acpi_backlight=native reboot=pci panic=0
    initrd /boot/initrd-maclite.img
}

menuentry "G1OS (Radeon KMS - Hardware Acceleration)" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite rd.maclite=1 mitigations=off console=tty0 \
          acpi_backlight=native radeon.modeset=1 radeon.uvd=1 \
          b43.fwok=1 reboot=pci panic=0
    initrd /boot/initrd-maclite.img
}

menuentry "G1OS Recovery Shell" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite rd.maclite=recovery nomodeset radeon.modeset=0 video=efifb:novesa console=tty0 reboot=pci panic=0
    initrd /boot/initrd-maclite.img
}

