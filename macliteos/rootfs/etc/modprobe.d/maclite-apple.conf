# MacLiteOS Apple hardware quirks and driver configuration (iMac Mid-2010)

# Apple Keyboard: natural layout and Fn behavior
options hid_apple fnmode=2
options hid_apple swap_opt_cmd=1

# Realtek ALC889 Audio: pin configuration for iMac11,2 and iMac11,3
# Ensures internal stereo speakers initialize unmuted and headphone sensing routes correctly
options snd_hda_intel model=imac27

# ATI Radeon HD 4670 / HD 5670: KMS modesetting and UVD hardware decode
options radeon modeset=1 uvd=1

# Broadcom BCM43224 Wi-Fi: allow firmware loading for b43 driver
options b43 fwok=1
